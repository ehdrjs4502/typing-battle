services:
  db:
    image: postgres:16
    container_name: typing-battle-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: typing_battle
    volumes:
      - typing-battle-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d typing_battle"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  typing-battle-pgdata:
